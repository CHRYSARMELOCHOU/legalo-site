<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEGALO pour Android</title>
<meta name="description" content="Téléchargez LEGALO sur votre téléphone Android en un seul geste.">
<style>
:root{--bg:#EAF0F9;--royal:#082858;--gold:#C9A24A;--muted:#506283}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(60vw 50vh at 85% 0%,rgba(27,79,176,.16),transparent 70%),radial-gradient(50vw 45vh at 0% 100%,rgba(201,162,74,.16),transparent 70%),var(--bg);color:var(--royal);font:16px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;padding:24px 16px}
main{width:min(100%,420px);text-align:center}
.logo{width:110px;height:110px;border-radius:28px;background:#fff;padding:8px;box-shadow:0 0 0 2px var(--gold),0 20px 50px -20px rgba(8,40,88,.6);object-fit:contain}
h1{font:700 1.8rem/1.2 Georgia,"Times New Roman",serif;margin:18px 0 6px}
.sub{margin:0 0 26px;color:var(--muted)}
.dl{display:block;width:100%;padding:20px;border-radius:20px;text-decoration:none;font-weight:800;font-size:1.25rem;color:#082858;background:linear-gradient(135deg,#F6E27A,#C9A24A);box-shadow:0 18px 40px -16px rgba(201,162,74,.9)}
.dl small{display:block;font-weight:600;font-size:.8rem;opacity:.8}
.dl:active{transform:scale(.98)}
#msg{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;text-align:left;font-size:.95rem;color:var(--muted);box-shadow:0 0 0 1px rgba(8,40,88,.12)}
#msg b{color:var(--royal)}
.fine{margin-top:22px;font-size:.78rem;color:var(--muted)}
.fine a{color:var(--royal)}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.webp" alt="Logo LEGALO">
  <h1>LEGALO</h1>
  <p class="sub">Le droit ivoirien, clair et accessible.</p>
  <a class="dl" id="dl" href="/LEGALO.apk" download="LEGALO.apk">Télécharger<small>Application Android</small></a>
  <div id="msg"><b>Le téléchargement a commencé.</b><br>Quand il est terminé, touchez le fichier <b>LEGALO</b> dans les notifications. Si le téléphone le demande, touchez <b>« Autoriser »</b> puis <b>« Installer »</b>.</div>
  <p class="fine">Sur iPhone ? <a href="https://app.legalo-officiel.com">Ouvrez LEGALO ici</a>.</p>
</main>
<script>
document.getElementById('dl').addEventListener('click',function(){
  setTimeout(function(){document.getElementById('msg').style.display='block';},400);
});
</script>
</body>
</html>
